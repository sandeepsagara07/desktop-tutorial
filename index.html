<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GK Test - 50 Questions</title><link rel="stylesheet" href="style.css"></head><body><main class="container">
<section id="start-screen" class="card"><h1>✨ Welcome to GK Test ✨</h1><p>Test your knowledge with 50 general knowledge questions.</p><button id="start-btn">Start Quiz</button></section>
<section id="quiz-screen" class="card hidden"><div class="top-bar"><span id="question-number"></span><span id="score-display">Score: 0</span></div><div class="progress"><div id="progress-bar"></div></div><h2 id="question"></h2><div id="options"></div><p id="feedback"></p><button id="next-btn" class="hidden">Next Question</button></section>
<section id="result-screen" class="card hidden"><h1>🎉 Quiz Completed!</h1><div id="final-score" class="result-score"></div><p id="result-message"></p><button id="restart-btn">Try Again</button></section></main><script src="script.js"></script></body></html>
